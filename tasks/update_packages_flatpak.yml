---

- name: Mask flatpak packages
  ansible.builtin.command:
    cmd: "flatpak mask {{ item }}"
  loop: "{{ ansible_bin_packages_versionlock_common|d([]) + ansible_bin_packages_versionlock|d([]) }}"
  changed_when: false
  check_mode: false

- name: List masked flatpak packages
  ansible.builtin.command:
    cmd: flatpak mask
  register: _ansible_bin_flatpak_packages_masked
  changed_when: false
  check_mode: false

- name: "[INFO] Print masked flatpak packages"
  ansible.builtin.debug:
    msg:
      - "Masked packages:"
      - "{{ _ansible_bin_flatpak_packages_masked.stdout_lines }}"
  when: _ansible_bin_flatpak_packages_masked.stdout_lines | length > 0

- name: List available flatpak packages updates
  ansible.builtin.command:
    cmd: flatpak remote-ls --updates --columns=application,commit
  register: _ansible_bin_flatpak_packages_available_updates
  changed_when: false
  check_mode: false

- name: Get current commits of installed flatpak packages
  ansible.builtin.command:
    cmd: flatpak list --columns=application,active
  register: _ansible_bin_flatpak_current_commits_raw
  changed_when: false
  check_mode: false
  when: _ansible_bin_flatpak_packages_available_updates.stdout_lines | length > 0

- name: Parse flatpak packages available updates
  ansible.builtin.set_fact:
    _flatpak_updates_appids: >-
      {{ _ansible_bin_flatpak_packages_available_updates.stdout_lines
         | map('regex_replace', '^(\S+)\s+.*$', '\1') | list }}
    _flatpak_updates_new_commits: >-
      {{ _ansible_bin_flatpak_packages_available_updates.stdout_lines
         | map('regex_replace', '^(\S+)\s+(\S+)$', '\2') | list }}
    _flatpak_current_commits_map: >-
      {{
        dict(
          _ansible_bin_flatpak_current_commits_raw.stdout_lines
          | map('regex_replace', '^(\S+)\s+(\S+).*$', '\1 \2')
          | map('split', ' ')
        )
      }}
  when: _ansible_bin_flatpak_packages_available_updates.stdout_lines | length > 0

- name: Build flatpak updates display list
  ansible.builtin.set_fact:
    _flatpak_updates_display: >-
      {{
        _flatpak_updates_appids
        | zip(
            _flatpak_updates_appids
            | map('extract', _flatpak_current_commits_map)
            | zip(_flatpak_updates_new_commits)
            | map('join', ' -> ')
          )
        | map('join', ' (')
        | map('regex_replace', '$', ')')
        | list
      }}
  when: _flatpak_updates_appids|d([]) | length > 0

- name: Update installed flatpak packages
  ansible.builtin.command:
    cmd: "flatpak update --noninteractive {{ _flatpak_updates_appids | join(' ') }}"
  check_mode: false
  when:
    - _ansible_bin_flatpak_packages_available_updates.stdout_lines | length > 0
    - not ansible_check_mode

- name: Append flatpak packages updates to tasks report
  ansible.builtin.set_fact:
    _tasks_report: >-
      {{ _tasks_report + _flatpak_updates_display | map('regex_replace', '^(.*)$', '[flatpak] \1') | list }}
  when: _flatpak_updates_display | d([]) | length > 0

- name: Unmask flatpak packages
  ansible.builtin.command:
    cmd: "flatpak mask --remove {{ item }}"
  loop: "{{ ansible_bin_packages_versionlock_common|d([]) + ansible_bin_packages_versionlock|d([]) }}"
  changed_when: false
  check_mode: false
  when: _ansible_bin_flatpak_packages_masked.stdout_lines | length > 0
