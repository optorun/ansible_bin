---
- name: "[{{ pkg.pkgName }}] Initialize variables"
  ansible.builtin.set_fact:
    _pkg_tmp_file: "/tmp/ansible_bin_{{ pkg.pkgName }}"
    _pkg_tmp_extract_dir: "/tmp/ansible_bin_{{ pkg.pkgName }}_extract"
    _pkg_dest_dir: "{{ pkg.pkgDirDestPath | d(ansible_bin_binaries_dir_dest_path) | expanduser }}"
    _pkg_dest_path: "{{ (pkg.pkgDirDestPath | d(ansible_bin_binaries_dir_dest_path) ~ '/' ~ pkg.pkgName) | expanduser }}"
    _pkg_needs_update: "{{ (_bin_versions[pkg.pkgName].version | d('')) != pkg.pkgVersion }}"

- name: "[{{ pkg.pkgName }}] Append to tasks report (check mode)"
  ansible.builtin.set_fact:
    _tasks_report: >-
      {{ _tasks_report + [pkg.pkgName ~ ': ' ~ pkg.pkgVersion ~  ' (would install; currently: ' ~ (_bin_versions[pkg.pkgName].version | d('not installed')) ~ ')'] }}
  when:
    - _pkg_needs_update | bool
    - ansible_check_mode

- name: Group package install / update related tasks
  when:
    - _pkg_needs_update | bool
    - not ansible_check_mode
  block:
    - name: "[{{ pkg.pkgName }}] Download package"
      ansible.builtin.get_url:
        url: "{{ pkg.pkgUrl }}"
        dest: "{{ _pkg_tmp_file }}"
        checksum: "{{ pkg.pkgChecksum | d(omit) }}"
        mode: 0644

    - name: "[{{ pkg.pkgName }}] Create destination directory"
      ansible.builtin.file:
        path: "{{ _pkg_dest_dir }}"
        state: directory
        mode: 0755

    - name: "[{{ pkg.pkgName }}] Detect file type"
      ansible.builtin.stat:
        path: "{{ _pkg_tmp_file }}"
        mime: true
      register: _pkg_stat

    - name: "[{{ pkg.pkgName }}] Set type flags"
      ansible.builtin.set_fact:
        _pkg_is_elf: >-
          {{ _pkg_stat.stat.mimetype in [
            'application/x-executable',
            'application/x-pie-executable',
            'application/x-elf',
            'text/x-perl',
            'text/plain'
          ] }}
        _pkg_is_archive: >-
          {{ _pkg_stat.stat.mimetype in [
            'application/zip',
            'application/gzip',
            'application/x-gzip',
            'application/x-tar',
            'application/x-bzip2',
            'application/x-xz',
            'application/x-7z-compressed'
          ] }}
        _pkg_is_deb: >-
          {{ _pkg_stat.stat.mimetype == 'application/vnd.debian.binary-package' }}

    - name: "[{{ pkg.pkgName }}] Fail on unsupported file type"
      ansible.builtin.fail:
        msg: "Unsupported MIME type for {{ pkg.pkgName }}: {{ _pkg_stat.stat.mimetype }}"
      when:
        - not _pkg_is_elf | bool
        - not _pkg_is_archive | bool
        - not _pkg_is_deb | bool

    # --- TYPE 1: SIMPLE BINARIES ---
    - name: Group simple binary install / update related tasks
      when: _pkg_is_elf | bool
      block:
        - name: "[{{ pkg.pkgName }}] Install binary"
          ansible.builtin.copy:
            src: "{{ _pkg_tmp_file }}"
            dest: "{{ _pkg_dest_path }}"
            mode: 0755
            remote_src: true
            force: true

        - name: "[{{ pkg.pkgName }}] Collect installed metrics (ELF)"
          ansible.builtin.set_fact:
            _pkg_meta_update:
              files: ["{{ _pkg_dest_path }}"]

    # --- TYPE 2: ARCHIVES (TARGETED & DYNAMIC) ---
    - name: Group archive install / update related tasks
      when: _pkg_is_archive | bool
      block:
        - name: "[{{ pkg.pkgName }}] Create temp extraction directory"
          ansible.builtin.file:
            path: "{{ _pkg_tmp_extract_dir }}"
            state: directory
            mode: 0755

        - name: "[{{ pkg.pkgName }}] Extract archive"
          ansible.builtin.unarchive:
            src: "{{ _pkg_tmp_file }}"
            dest: "{{ _pkg_tmp_extract_dir }}"
            remote_src: true

        - name: "[{{ pkg.pkgName }}] Copy files from archive"
          ansible.posix.synchronize:
            src: "{{ _pkg_tmp_extract_dir }}/{{ item }}"
            dest: "{{ _pkg_dest_dir }}/"
            recursive: true
            delete: false
          delegate_to: "{{ inventory_hostname }}"
          loop: "{{ pkg.pkgArchiveFilesToExtract | d([]) or ['.'] }}"

        - name: "[{{ pkg.pkgName }}] Find all extracted files (For implicit/dynamic archives)"
          ansible.builtin.find:
            paths: "{{ _pkg_tmp_extract_dir }}"
            recurse: true
            file_type: any
          register: _pkg_found_files
          when: "pkg.pkgArchiveFilesToExtract | d([]) | length == 0"

        - name: "[{{ pkg.pkgName }}] Collect installed metrics (Archive)"
          ansible.builtin.set_fact:
            _pkg_meta_update:
              files: >-
                {{
                  (pkg.pkgArchiveFilesToExtract | d([]) | length > 0) | ternary(
                    pkg.pkgArchiveFilesToExtract | map('regex_replace', '^', _pkg_dest_dir ~ '/'),
                    _pkg_found_files.files | map(attribute='path') | map('relpath', _pkg_tmp_extract_dir) | map('regex_replace', '^', _pkg_dest_dir ~ '/')
                  ) | list
                }}

    # --- TYPE 3: DEB PACKAGES ---
    - name: Group deb install / update related tasks
      when: _pkg_is_deb | bool
      block:
        - name: "[{{ pkg.pkgName }}] Extract true package name from .deb metadata"
          ansible.builtin.command: "dpkg-deb -f {{ _pkg_tmp_file }} Package"
          register: _pkg_deb_true_name
          changed_when: false

        - name: "[{{ pkg.pkgName }}] Install .deb package"
          ansible.builtin.apt:
            deb: "{{ _pkg_tmp_file }}"
          become: true

        - name: "[{{ pkg.pkgName }}] Collect installed metrics (deb)"
          ansible.builtin.set_fact:
            _pkg_meta_update:
              dpkg_name: "{{ _pkg_deb_true_name.stdout | trim }}"

    # --- TRACKING FILE PERSISTENCE ---
    - name: Group version matrix update related tasks
      block:
        - name: "[{{ pkg.pkgName }}] Build package metadata"
          ansible.builtin.set_fact:
            _pkg_combined_payload: >-
              {{
                _bin_versions | combine({
                  pkg.pkgName: ({ 'version': pkg.pkgVersion } | combine(_pkg_meta_update))
                })
              }}

        - name: "[{{ pkg.pkgName }}] Update version matrix on disk"
          ansible.builtin.copy:
            content: "{{ _pkg_combined_payload | to_nice_json }}"
            dest: "{{ ansible_bin_binaries_versions_track_file_path | expanduser }}"
            mode: 0644

        - name: "[{{ pkg.pkgName }}] Update version matrix in memory"
          ansible.builtin.set_fact:
            _bin_versions: "{{ _pkg_combined_payload }}"

    - name: "[{{ pkg.pkgName }}] Append to tasks report"
      ansible.builtin.set_fact:
        _tasks_report: >-
          {{ _tasks_report + [pkg.pkgName ~ ': ' ~ pkg.pkgVersion ~ ' (SUCCESS)'] }}

  rescue:
    - name: "[{{ pkg.pkgName }}] Append failures to tasks report"
      ansible.builtin.set_fact:
        _tasks_report: >-
          {{ _tasks_report + [pkg.pkgName ~ ': ' ~ pkg.pkgVersion ~ ' (FAILED)'] }}
        _tasks_report_had_failures: true

  always:
    - name: "[{{ pkg.pkgName }}] Cleanup temp files"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _pkg_tmp_file }}"
        - "{{ _pkg_tmp_extract_dir }}"
